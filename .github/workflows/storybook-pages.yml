# Builds Storybook and publishes it to the gh-pages branch of this repository.
# Requires the Pages source to be "Deploy from a branch": branch gh-pages, folder /.

name: Storybook Pages

on:
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time. Do not cancel a deploy in progress.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Same cache keys as build.yml, so the two workflows share caches
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache generated IDL
        id: cache-idl
        uses: actions/cache@v4
        with:
          path: src/__generated__
          key: ${{ runner.os }}-idl-${{ hashFiles('package.json') }}

      - name: Generate IDL
        if: steps.cache-idl.outputs.cache-hit != 'true'
        run: npm run install-idl && npm run generate:idl

      - name: Build Storybook
        run: npm run build-storybook

      # Stop GitHub Pages from running Jekyll, which drops files that start with "_"
      - name: Disable Jekyll
        run: touch storybook-static/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: storybook-static
          clean: true
          single-commit: true
